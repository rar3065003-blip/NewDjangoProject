{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>Блог нашего сайта</h1>
    <div class="row">
        {% for blog in blogs %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ blog.title }}</h5>
                        <p class="card-text">{{ blog.content|truncatewords:30 }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}

    </div>
</div>
{% endblock %}
