{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Вы уверены, что хотите удалить статью "{{ object.title }}"?</h2>

    <form method="post" class="mt-4">
        {% csrf_token %}

        <button type="submit" class="btn btn-success mt-3">Подтвердить удаление</button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
